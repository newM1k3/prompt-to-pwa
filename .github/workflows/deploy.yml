# ============================================================================
# Prompt-to-PWA — CI/CD Pipeline
# Triggers on push to main. Builds, validates env, deploys to Netlify.
# ============================================================================

name: Deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual trigger from GitHub UI

env:
  NODE_VERSION: "20"

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Quality Gates (run on every PR and push)
  # ────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (verify it compiles)
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────
  # Environment Validation (runs on push to main before deploy)
  # ────────────────────────────────────────────────────────────────────────
  validate-env:
    name: Validate Environment Variables
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run env validator
        run: node scripts/validate-env.mjs
        env:
          # Pull from GitHub Secrets — validator checks these exist
          VITE_POCKETBASE_URL: ${{ secrets.VITE_POCKETBASE_URL }}
          POCKETBASE_ADMIN_EMAIL: ${{ secrets.POCKETBASE_ADMIN_EMAIL }}
          POCKETBASE_ADMIN_PASSWORD: ${{ secrets.POCKETBASE_ADMIN_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

  # ────────────────────────────────────────────────────────────────────────
  # Deploy to Netlify
  # ────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate-env
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: "./dist"
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy ${{ github.sha }} — ${{ github.event.head_commit.message }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10

  # ────────────────────────────────────────────────────────────────────────
  # Post-Deploy Health Check
  # ────────────────────────────────────────────────────────────────────────
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Wait for deploy to propagate
        run: sleep 30

      - name: Check site is live
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Site returned HTTP $HTTP_CODE — deploy may have failed"
            exit 1
          fi
          echo "Site is live at $SITE_URL (HTTP $HTTP_CODE)"

      - name: Check health endpoint
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          HEALTH=$(curl -s "$SITE_URL/.netlify/functions/health")
          echo "Health response: $HEALTH"
          STATUS=$(echo "$HEALTH" | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
          if [ "$STATUS" != "ok" ] && [ "$STATUS" != "degraded" ]; then
            echo "Health check failed with status: $STATUS"
            exit 1
          fi
          echo "Health check passed: $STATUS"
